[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillmind"
version = "0.1.0"
description = "开源 Claude Code Skill 知识提炼系统 - 将分散的 SKILL.md 提炼为 Obsidian 知识库"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "mistune>=3",
    "litellm>=1.40",
    "gitpython>=3.1",
    "watchdog>=4",
    "jsonschema>=4.21",
    "httpx>=0.27",
]

[project.optional-dependencies]
search = ["chromadb>=0.5"]

[project.scripts]
skillmind = "skillmind.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["skillmind*"]
