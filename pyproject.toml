[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillmind"
version = "2.3.0"
description = "全源知识提炼系统 - 将 Skill/博客/论坛经验提炼为 Obsidian 知识库"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "litellm>=1.40",
    "gitpython>=3.1",
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
# 语义搜索（可选）
search = ["chromadb>=0.5"]
# RSS 解析增强（可选，降级用 httpx+正则）
rss = ["feedparser>=6.0"]
# Web 正文提取增强（可选，降级用 httpx+正则）
web = ["crawl4ai>=0.4"]
# 完整安装（所有可选功能）
full = ["chromadb>=0.5", "feedparser>=6.0", "crawl4ai>=0.4"]

[project.scripts]
skillmind = "skillmind.cli:main"

[tool.setuptools.packages.find]
where = [""]
include = ["skillmind*"]
